name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check library ownership
        run: python scripts/check-boundary.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --verbose --timeout 60
