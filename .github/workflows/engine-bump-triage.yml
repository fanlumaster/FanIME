name: Engine bump triage

# Dependabot opens the engine submodule bump; this decides whether it can merge itself.
#
# The rule is an allowlist, not a blocklist: the bump merges on green CI only when every file the
# engine changed across the range is provably inert. Anything else waits for a human. A blocklist
# would have let the utfcpp bump through, because it appears in the range as a bare submodule
# pointer rather than as a source file.

on:
  pull_request:
    paths:
      - 'vendor/MetasequoiaImeEngine'

# Read-only by default, matching every other workflow here. The write scopes this job needs to merge
# the bump are granted on the job instead, so a second job added later starts from the same floor
# rather than inheriting write.
permissions:
  contents: read

jobs:
  triage:
    if: github.actor == 'dependabot[bot]'
    name: Classify the engine range
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      SUBMODULE: vendor/MetasequoiaImeEngine
      ENGINE: metasequoiaime/MSIME-Engine
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the engine range
        id: range
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base=$(git rev-parse "origin/$BASE_REF:$SUBMODULE")
          head=$(git rev-parse "HEAD:$SUBMODULE")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "引擎 $base -> $head"

      - name: Classify the changed files
        id: classify
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          base="$BASE"
          head="$HEAD"
          if [ "$base" = "$head" ]; then
            echo "verdict=inert" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail closed on anything but a plain fast-forward. The compare API answers with an empty
          # file list whenever head is already an ancestor of base, which the emptiness test below
          # would otherwise read as "nothing suspicious changed" and auto-merge — silently accepting
          # a downgrade that reverts engine source the frontend depends on.
          status=$(gh api "repos/$ENGINE/compare/$base...$head" --jq '.status')
          echo "compare status: $status"
          if [ "$status" != "ahead" ]; then
            echo "verdict=review" >> "$GITHUB_OUTPUT"
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "reason<<$delimiter"
              echo "引擎范围不是单纯的快进（compare status: $status），需要人工确认。"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api --paginate "repos/$ENGINE/compare/$base...$head" --jq '.files[].filename')
          echo "改动文件:"; echo "$files" | sed 's/^/  /'
          if [ -z "$files" ]; then
            echo "verdict=review" >> "$GITHUB_OUTPUT"
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "reason<<$delimiter"
              echo "compare 没有返回任何文件，无法判定这次 bump 是否安全。"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Provably inert: documentation, CI wiring, dependency manifests, licence text. Everything
          # else - sources, build files, and bare paths such as a nested submodule pointer - needs a
          # human. Note the trailing anchors: 'utfcpp' matches none of these patterns and so lands
          # in review, which is the behaviour we want.
          suspicious=$(echo "$files" | grep -vE '(^|/)[^/]+\.md$|^\.github/|^vcpkg\.json$|^vcpkg-configuration\.json$|^LICENSE$|^\.gitignore$' || true)

          if [ -z "$suspicious" ]; then
            echo "verdict=inert" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=review" >> "$GITHUB_OUTPUT"
            # A random delimiter: the file names come from another repository, so a path that
            # happened to be the literal delimiter could otherwise close the block early.
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "reason<<$delimiter"
              echo "$suspicious"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          fi

      # The product lock records the engine commit for provenance and for the release gate that
      # refuses a commit nobody merged. A bump that moves the submodule without the lock leaves the
      # two disagreeing, and verify-contracts fails the whole product-inputs job rather than this
      # pull request, so say plainly which file has to move.
      - name: Check the lock followed the submodule
        id: lock
        run: |
          set -euo pipefail
          if python3 scripts/product_lock.py verify-contracts .; then
            echo "locked=yes" >> "$GITHUB_OUTPUT"
          else
            echo "locked=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        # The lock guard belongs here. It used to be appended to the HEAD environment value instead,
        # where it was not a condition at all: auto-merge ran whether or not the contract lock
        # verified, and the comment below printed the commit followed by the literal text
        # "&& steps.lock.outputs.locked == 'yes'".
        if: steps.classify.outputs.verdict == 'inert' && steps.lock.outputs.locked == 'yes'
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "$PR_URL"
          body="$RUNNER_TEMP/engine-bump-comment.md"
          printf '引擎 `%s` → `%s` 的改动全部落在文档、CI 配置和依赖清单里，没有源码、构建文件或嵌套 submodule 指针。已开启自动合并，CI 通过后自行合入。\n' "$BASE" "$HEAD" > "$body"
          gh pr comment "$PR_URL" --body-file "$body"

      # Every value below reaches the shell through the environment, never through ${{ }}
      # interpolation. REASON is a list of file names from another repository: spliced into the
      # command text, a path containing a single quote would have closed the quoting and run as a
      # command, on a runner holding a contents:write token for this repository.
      - name: Hold for review
        if: steps.classify.outputs.verdict == 'review'
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_URL" --add-label "needs-review" || true
          body="$RUNNER_TEMP/engine-bump-comment.md"
          printf '引擎 `%s` → `%s` 的改动里有需要人看一眼的部分，未开启自动合并：\n\n```\n%s\n```\n\n源码、`CMakeLists.txt` 或嵌套 submodule 指针的变化都可能改变行为，而前端 CI 未必覆盖得到——`helpcode_enabled()` 与 `handle_character()` 的语义变更就是这样漏过去的。\n' "$BASE" "$HEAD" "$REASON" > "$body"
          gh pr comment "$PR_URL" --body-file "$body"

      - name: Ask for the lock to follow
        if: steps.lock.outputs.locked == 'no'
        run: |
          set -euo pipefail
          gh pr comment "$PR_URL" --body "引擎 submodule 动了但 \`product-lock.json\` 里的 \`engine.commit\` 没跟上，产物清单会记录错误的引擎来源，发布门禁也拦不住未合入的引擎提交。跑 \`python3 scripts/product_lock.py refresh --dictionary-tag <当前 tag>\` 或直接改这一个字段，再推上来。"
