name: CI

on:
  push:
    branches: [main]
  pull_request:
    # A release-please pull request only rewrites these three files, and its pull_request run would
    # be created in action_required and never execute: GITHUB_TOKEN may not start workflows, so
    # anything it triggers waits for a human. Skipping it here keeps an unapprovable run out of the
    # checks list. The release workflow dispatches this workflow on the release branch instead,
    # which is the one trigger GITHUB_TOKEN is allowed to fire, so the version bump still gets a
    # full build and the checks land on the same commit.
    paths-ignore:
      - version.txt
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product:
    uses: ./.github/workflows/product-ci.yml

  build:
    name: Windows ${{ matrix.name }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            architecture: x64
            triplet: x64-windows-static
          - name: Win32
            architecture: Win32
            triplet: x86-windows-static
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        shell: pwsh
        run: vcpkg install --triplet ${{ matrix.triplet }}
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A ${{ matrix.architecture }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Test the wire contract on this architecture
        run: ctest --test-dir build -C Release --output-on-failure

      # The release job's only Inno Setup input is this language file, and it landed next to the
      # Chocolatey shim instead of in the Inno Setup installation for eight releases in a row: the
      # script reported success and packaging failed later with an unrelated-looking include error.
      # Compiling a script that resolves compiler:Languages\ChineseSimplified.isl is the assertion
      # that the file is somewhere ISCC actually looks, and it costs seconds on an image that
      # already has Inno Setup. Architecture-independent, so it runs once.
      - name: Check the installer language file lands where ISCC looks
        if: ${{ matrix.name == 'x64' }}
        shell: pwsh
        run: |
          ./scripts/ci/install-inno-language.ps1
          $probe = Join-Path $env:RUNNER_TEMP 'language-probe.iss'
          @(
            '[Setup]'
            'AppName=Language probe'
            'AppVersion=1.0'
            'DefaultDirName={autopf}\LanguageProbe'
            "OutputDir=$env:RUNNER_TEMP"
            'OutputBaseFilename=language-probe'
            '[Languages]'
            'Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"'
          ) | Set-Content -Path $probe -Encoding UTF8
          ISCC.exe $probe
          if ($LASTEXITCODE -ne 0) { throw "ISCC could not resolve compiler:Languages\ChineseSimplified.isl" }
