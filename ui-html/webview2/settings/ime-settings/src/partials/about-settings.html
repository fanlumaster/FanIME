<div class="content document-page">
  <div class="content-header"><span>关于</span></div>

  <div class="section document-hero about-hero">
    <div class="about-mark"><img src="./assets/msime.svg" alt="水杉 IME"></div>
    <div><div class="document-eyebrow">Metasequoia IME</div><div class="document-hero-title">水杉 IME</div>
    <p>为现代 Windows 桌面体验打造的开放中文输入法。</p></div>
  </div>

  <div class="section about-links">
    <div class="about-link-row about-version-row">
      <div>
        <div class="about-link-title">当前版本</div>
        <div class="about-version">v0.0.6</div>
        <div id="about-update-status" class="about-update-status" role="status" aria-live="polite"></div>
      </div>
      <button id="about-check-update" type="button" class="about-update-button">检查更新</button>
    </div>
    <button type="button" class="about-link-row about-document-link">
      <span class="about-link-title">用户协议</span><span class="about-link-arrow" aria-hidden="true">↗</span>
    </button>
    <button type="button" class="about-link-row about-document-link">
      <span class="about-link-title">隐私政策</span><span class="about-link-arrow" aria-hidden="true">↗</span>
    </button>
  </div>

  <div class="section candidate-window-diagnostic-section">
    <div class="section-header">
      <div>
        <div class="section-title">候选框诊断日志</div>
        <div class="quick-phrase-description">仅在排查候选框异常时开启。记录窗口、WebView2、焦点会话和通信状态，不记录输入内容或候选文本。日志位于本地应用数据目录的 metasequoiaime\logs。</div>
      </div>
      <div class="ftb-toggle-btn" id="candidateWindowDiagnosticLogToggleBtn" role="switch" aria-checked="false" tabindex="0">
        <div class="ftb-toggle-knob"></div>
      </div>
    </div>
  </div>

  <dialog id="about-update-dialog" class="about-update-dialog" aria-labelledby="about-update-dialog-title">
    <div class="about-update-dialog-body">
      <div id="about-update-dialog-title" class="about-update-dialog-title">发现新版本</div>
      <p>水杉 IME <strong id="about-update-dialog-version"></strong> 已发布，是否前往 GitHub Releases 下载？</p>
    </div>
    <div class="about-update-dialog-actions">
      <button id="about-update-cancel" type="button" class="about-dialog-button">稍后</button>
      <button id="about-update-download" type="button" class="about-dialog-button about-dialog-primary">前往下载</button>
    </div>
  </dialog>
</div>
