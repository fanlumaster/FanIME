<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>IME(FTB)</title>
  <style>
    body {
      background-color: transparent;
      margin: 0;
      height: 100vh;
      -webkit-app-region: drag;
    }

    /* 状态栏整体样式 */
    .status-bar {
      position: absolute;
      height: 35px;
      top: 0px;
      left: 0px;
      display: flex;
      align-items: center;
      background-color: #1a1a1a;
      border-radius: 8px;
      padding: 0px 10px;
      padding-left: 8px;
      padding-right: 4px;
      gap: 6px;

      border: 1.4px solid rgba(255, 255, 255, 0.15);
      box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    /* 拖动条 */
    .drag-handle {
      color: ;
      width: 2.5px;
      height: 14px;
      border-radius: 2px;
      background: #8E8CD8;
      margin-right: 0px;
      position: relative;
    }

    /* 分隔线 */
    .divider {
      width: 1.2px;
      align-self: stretch;
      background-color: rgba(255, 255, 255, 0.15);
      margin-left: 4px;
      margin-right: 0px;
    }

    .icon {
      color: #fff;
      font-size: 20px;
      font-family: "Segoe UI Symbol", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      transition: background-color 0.15s ease;
      cursor: default;
    }

    .fluent-icon {
      font-family: "Segoe Fluent Icons";
      font-size: 22px;
      font-weight: normal;
      line-height: 1;
      user-select: none;
    }

    .icon:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .right-section {
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>

<body>

  <div class="status-bar">
    <div class="left-section">
      <div class="drag-handle"></div>
    </div>

    <div class="divider"></div>

    <div class="right-section">
      <!-- 1. 输入法状态 -->
      <!-- 中文状态 -->
      <div id="cn-en" data-toolbar-item="language">
        <div class="icon" id="cn">
          <span class="fluent-icon" aria-hidden="true">&#xE982;</span>
        </div>
        <!-- 英文状态 -->
        <div class="icon" id="en">
          <span class="fluent-icon" aria-hidden="true">&#xE983;</span>
        </div>
      </div>

      <div id="char-width-mode" data-toolbar-item="fullwidth">
      <!-- 2. 字符状态 -->
      <!-- 半角 -->
      <div class="icon" id="halfwidth">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M21 14.2894C17.8146 15.1746 14.3993 14.2763 12.0615 11.9385C9.72366 9.60074 8.82541 6.18545 9.71056 3C5.44557 4.18647 2.63796 8.25133 3.03782 12.6602C3.43767 17.069 6.93101 20.5623 11.3399 20.9622C15.7487 21.362 19.8136 18.5544 21 14.2894Z"
            stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <!-- 全角 -->
      <div class="icon" id="fullwidth">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9.25" stroke="white" stroke-width="1.5" />
        </svg>
      </div>
      </div>

      <div id="punctuation-mode" data-toolbar-item="punctuation">
      <!-- 中文标点 -->
      <div class="icon" id="puncCn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7.5" cy="7.5" r="2.5" stroke="white" />
          <circle cx="17" cy="15" r="2" fill="white" stroke="white" />
          <path d="M19 15C19 17 17.7059 18.6765 16 20.5" stroke="white" />
        </svg>
      </div>
      <!-- 英文标点 -->
      <div class="icon" id="puncEn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="7.5" cy="7.5" r="1.5" fill="white" stroke="white" />
          <path d="M18 16L15.5 21H14L16 16H18Z" fill="white" />
        </svg>
      </div>
      </div>

      <div class="icon" id="character-set" data-toolbar-item="character_set">
        <span id="character-set-simplified" class="fluent-icon" aria-hidden="true">&#xE88D;</span>
        <span id="character-set-traditional" class="fluent-icon" style="display: none" aria-hidden="true">&#xE88C;</span>
      </div>
      <div class="icon" id="emoji-panel" data-toolbar-item="emoji">
        <span class="fluent-icon" aria-hidden="true">&#xE76E;</span>
      </div>
      <div class="icon" id="screen-keyboard" data-toolbar-item="screen_keyboard" style="display: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.25" y="4.25" width="17.5" height="12.5" rx="1.75" stroke="white" stroke-width="1.5"/>
          <path d="M8 20H16M12 17V20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6.5 8H7.5M10 8H11M13.5 8H14.5M17 8H18M6.5 11H7.5M10 11H11M13.5 11H14.5M17 11H18M8 14H16"
            stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="icon" id="settings" data-toolbar-item="settings">
        <span class="fluent-icon" aria-hidden="true">&#xE713;</span>
      </div>
    </div>
  </div>
</body>
<script>
  // 
  // 左侧拖拽区域
  //
  let dividerX = 0;

  // 初始化时或窗口尺寸变化时更新一次
  function updateDividerX() {
    const divider = document.querySelector('.divider');
    if (divider) {
      dividerX = divider.getBoundingClientRect().left;
    }
  }

  let isDragging = false, startX, startY;

  window.addEventListener('mousedown', e => {
    if (e.clientX < dividerX) { // 左部区域
      isDragging = true;
      window.chrome.webview.postMessage(JSON.stringify({ type: 'dragStart' }));
    }
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
  });

  window.addEventListener('resize', updateDividerX);
  window.addEventListener('load', updateDividerX);

  //
  // 中英切换
  //
  // Default status is CN
  document.getElementById('en').style.display = 'none';
  // document.getElementById('cn').style.display = 'none';
  // 中英切换点击，向 Cpp 端发送消息
  document.getElementById('cn').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'changeIMEMode', data: 'en' }));
  });
  document.getElementById('en').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'changeIMEMode', data: 'cn' }));
  });

  //
  // 半角全角切换
  //
  // Default status is Halfwidth
  document.getElementById('fullwidth').style.display = 'none';
  // document.getElementById('halfwidth').style.display = 'none';
  document.getElementById('halfwidth').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'changeCharMode', data: 'fullwidth' }));
  });
  document.getElementById('fullwidth').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'changeCharMode', data: 'halfwidth' }));
  });

  //
  // 中英文标点切换
  //
  // Default status is CN Punc
  document.getElementById('puncEn').style.display = 'none';
  // document.getElementById('puncCn').style.display = 'none';
  document.getElementById('puncCn').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'changePuncMode', data: 'puncEn' }));
  });
  document.getElementById('puncEn').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'changePuncMode', data: 'puncCn' }));
  });

  //
  // 简繁输入切换
  //
  document.getElementById('character-set').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'changeCharacterSet' }));
  });

  document.getElementById('emoji-panel').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'openEmojiPanel' }));
  });

  document.getElementById('screen-keyboard').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'openKeyboardPanel' }));
  });

  //
  // 设置按钮
  //
  document.getElementById('settings').addEventListener('click', () => {
    window.chrome.webview.postMessage(JSON.stringify({ type: 'openSettings' }));
  });

</script>

</html>
