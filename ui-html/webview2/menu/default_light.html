<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>(IME)TrayMenu</title>
  <style>
    :root {
      --msime-max-width-dip: 50vw;
      --msime-max-height-dip: 50vh;
    }

    html,
    body {
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .menu {
      box-sizing: border-box;
      background-color: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      padding: 0.2em 0;
      width: max-content;
      min-width: 12em;
      max-width: min(100%, var(--msime-max-width-dip));
      max-height: min(100vh, var(--msime-max-height-dip));
      overflow: auto;
      overflow-wrap: anywhere;
      white-space: normal;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      user-select: none;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4em 0.4em;
      font-size: 14px;
      color: #1a1a1a;
      border-radius: 6px;
      margin: 1px 6px;
    }

    .menu-item:hover {
      background-color: #f0f0f0;
      color: #1a1a1a;
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: inherit;
      flex-shrink: 0;
    }

    .menu-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .toggle {
      position: relative;
      width: 32px;
      height: 16px;
      background: #c8c8c8;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .toggle.active {
      background: #8E8CD8;
    }

    .toggle.active::after {
      transform: translateX(16px);
    }

  </style>
</head>

  <script>
    // Initial state comes from C++ (SyncMenuFloatingToolbarToggle) so this
    // toggle stays in sync with Settings / general.floating_toolbar.
    const toggle = document.getElementById('floatingToggle');
    toggle.addEventListener('click', () => {
      toggle.classList.toggle('active');
      console.log("floatingToggle: ", toggle.classList.contains('active'));
      // 向 C++ 端发送消息，隐藏/显示悬浮工具栏
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'floatingToggle',
        data: toggle.classList.contains('active')
      }));
    });

    // 表情和符号共用同一个原生面板。
    const emojiSymbols = document.getElementById('emojiSymbols');
    emojiSymbols.addEventListener('click', () => {
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'emojiSymbols',
      }));
    });

    // 屏幕键盘：由原生服务启动独立面板。
    const keyboardPanel = document.getElementById('keyboardPanel');
    keyboardPanel.addEventListener('click', () => {
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'keyboardPanel',
      }));
    });

    // 语音输入：启动独立的 MetasequoiaVoiceInput 应用。
    const voiceInput = document.getElementById('voiceInput');
    voiceInput.addEventListener('click', () => {
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'voiceInput',
      }));
    });

    // 设置：向 C++ 端发送消息，打开设置
    const settings = document.getElementById('settings');
    settings.addEventListener('click', () => {
      console.log("settings");
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'settings',
      }));
    });

    // 关于：打开设置窗口并定位到“关于”分区。
    const about = document.getElementById('about');
    about.addEventListener('click', () => {
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'about',
      }));
    });
  </script>
  <script>
  (function () {
    var SURFACE = 'menu';
    var SELECTOR = '#menuContainer';
    var COOLDOWN_MS = 450;
    var lastSent = 0;
    var pending = false;
    function el() { return document.querySelector(SELECTOR); }
    function truncated(node) {
      if (!node) return false;
      var vw = document.documentElement.clientWidth;
      var vh = document.documentElement.clientHeight;
      var r = node.getBoundingClientRect();
      var pad = 1.5;
      return node.scrollWidth > vw + pad || node.scrollHeight > vh + pad ||
        r.width > vw + pad || r.height > vh + pad ||
        r.right > vw + pad || r.bottom > vh + pad;
    }
    function report() {
      var node = el();
      if (!node || !truncated(node)) return;
      if (!window.chrome || !window.chrome.webview) return;
      var now = Date.now();
      if (now - lastSent < COOLDOWN_MS) return;
      lastSent = now;
      var r = node.getBoundingClientRect();
      window.chrome.webview.postMessage(JSON.stringify({
        type: 'contentTruncated',
        data: {
          surface: SURFACE,
          width: Math.ceil(Math.max(r.width, node.scrollWidth || 0)),
          height: Math.ceil(Math.max(r.height, node.scrollHeight || 0)),
          viewportWidth: document.documentElement.clientWidth,
          viewportHeight: document.documentElement.clientHeight
        }
      }));
    }
    function schedule() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          pending = false;
          report();
        });
      });
    }
    window.CheckContentTruncation = schedule;
    window.addEventListener('resize', schedule);
    window.addEventListener('load', schedule);
    if (typeof ResizeObserver !== 'undefined') {
      var ro = new ResizeObserver(schedule);
      ro.observe(document.documentElement);
      var node = el();
      if (node) ro.observe(node);
    }
  })();
  </script>
