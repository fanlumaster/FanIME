name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  settings:
    name: Build settings page
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webview2/settings/ime-settings
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webview2/settings/ime-settings/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same command the Windows release workflow runs. Until now it was only ever exercised
      # during a release, so a break here surfaced while cutting a version.
      - name: Build
        run: pnpm build

      - name: Check the output the installer collects
        run: |
          test -f dist/index.html
          echo "dist contents:"
          ls -la dist
